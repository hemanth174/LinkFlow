name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run create:icon
      - run: npx electron-builder --config desktop/electron-builder.json --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
