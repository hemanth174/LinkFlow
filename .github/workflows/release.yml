name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      - name: Align package version with release tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm version $version --no-git-tag-version
      - run: npm run create:icon
      - name: Build Windows installer with retry
        shell: pwsh
        run: |
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installer build attempt $attempt of $maxAttempts"
            npx electron-builder --config desktop/electron-builder.json --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Host "Electron download failed; waiting before retry..."
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          exit 1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path . -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notlike "*uninstaller*" -and $_.FullName -notlike "*node_modules*" -and $_.DirectoryName -notlike "*win-unpacked*" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "LinkFlow installer was not found after the build." }
          $releaseInstaller = Join-Path (Get-Location) "LinkFlow-Setup.exe"
          Copy-Item $installer.FullName $releaseInstaller -Force
          $assets = @($releaseInstaller)
          $blockmap = Get-ChildItem -Path $installer.DirectoryName -Filter "*.blockmap" | Select-Object -First 1
          if ($blockmap) { $assets += $blockmap.FullName }
          gh release create "${{ github.ref_name }}" $assets --repo "hemanth174/LinkFlow" --title "LinkFlow ${{ github.ref_name }}" --generate-notes
